[project]
name = "orbscreen"
version = "0.1.0"
description = "Fast surrogate for Orb-v3 MOF stability screening"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.23",
    "pymatgen>=2024.5.1",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
orbscreen = "orbscreen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbscreen"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
